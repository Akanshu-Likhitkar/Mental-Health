
name: Mental Health - EC2 Deployment

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Deployment
        run: |
          set -e

          mkdir -p /home/ubuntu/Pro-1

          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='.env' \
            ./ /home/ubuntu/Pro-1/

      - name: Install Dependencies
        run: |
          set -e

          cd /home/ubuntu/Pro-1

          python3 -m venv venv

          ./venv/bin/pip install --upgrade pip
          ./venv/bin/pip install -r requirements.txt

          test -f Mental_Health_Model.pkl

      - name: Configure FastAPI
        run: |
          set -e

          sudo tee /etc/systemd/system/mental-health.service > /dev/null <<'EOF'
          [Unit]
          Description=Mental Health FastAPI
          After=network.target

          [Service]
          User=ubuntu
          WorkingDirectory=/home/ubuntu/Pro-1
          ExecStart=/home/ubuntu/Pro-1/venv/bin/uvicorn main:app --host 0.0.0.0 --port 8000
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          EOF

      - name: Restart FastAPI
        run: |
          set -e

          sudo systemctl daemon-reload
          sudo systemctl enable mental-health
          sudo systemctl restart mental-health

          sleep 5

          sudo systemctl is-active mental-health

      - name: Verify Application
        run: |
          set -e

          curl --fail --silent \
            http://127.0.0.1:8000/

          echo "Mental Health API deployed successfully!"
