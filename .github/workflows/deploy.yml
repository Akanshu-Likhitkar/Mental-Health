
name: Deploy to AWS EC2

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy files to EC2
        shell: bash
        run: |
          set -e

          DEPLOY_DIR="/home/ubuntu/Pro-1"

          echo "Starting deployment..."

          mkdir -p "$DEPLOY_DIR"

          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.env' \
            --exclude='.venv/' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            "$GITHUB_WORKSPACE/" "$DEPLOY_DIR/"

          echo "Files copied successfully."

      - name: Verify deployment
        shell: bash
        run: |
          set -e
          cd /home/ubuntu/Pro-1
          echo "Deployment successful"
          pwd
          ls -la
